<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joining Fers Innova...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0B1A2E;
    color: #F8F4EE;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .logo {
    font-size: 1.2rem;
    font-weight: 700;
    color: #d08601;
    margin-bottom: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(208,134,1,0.2);
    border-top-color: #d08601;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p {
    font-size: 1rem;
    color: rgba(248,244,238,0.7);
    margin-bottom: 32px;
  }
  .manual-btn {
    display: inline-block;
    background: #25D366;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 4px;
    text-decoration: none;
    display: none;
  }
</style>
</head>
<body>
  <div class="logo">Fers Innova</div>
  <div class="spinner"></div>
  <p>Opening WhatsApp group...</p>
  <a href="https://chat.whatsapp.com/DdjjarQyUNtAXRRQlzke3A" class="manual-btn" id="manualBtn">
    Tap Here to Join WhatsApp Group
  </a>

<script>
  const GROUP_CODE = 'DdjjarQyUNtAXRRQlzke3A';
  const WEB_LINK = 'https://chat.whatsapp.com/' + GROUP_CODE;
  const INTENT = 'intent://invite/' + GROUP_CODE + '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + WEB_LINK + ';end';
  const UNIVERSAL = 'https://wa.me/invite/' + GROUP_CODE;

  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isFacebook = /FBAN|FBAV|FB_IAB/i.test(ua);

  function showManualButton() {
    document.querySelector('p').textContent = "WhatsApp didn't open automatically.";
    document.getElementById('manualBtn').style.display = 'inline-block';
    document.querySelector('.spinner').style.display = 'none';
  }

  function redirect(url) {
    window.location.href = url;
    // Show manual button after 3 seconds as fallback
    setTimeout(showManualButton, 3000);
  }

  if (isFacebook) {
    // Inside Facebook browser - use universal link
    redirect(UNIVERSAL);
  } else if (isAndroid) {
    // Android normal browser - use intent URL
    redirect(INTENT);
  } else if (isIOS) {
    // iOS - use universal link
    redirect(UNIVERSAL);
  } else {
    // Desktop
    redirect(WEB_LINK);
  }
</script>
</body>
</html>
